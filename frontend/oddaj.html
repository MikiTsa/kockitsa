<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oddaj oglas – KockiTsa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-login>
    <header id="header"></header>
    <main>
        <div class="panel">
            <h2>Oddaja oglasa</h2>
            <form id="form" class="form">
                <label>
                    Komplet iz kataloga *
                    <input id="set" list="sets" placeholder="številka ali ime kompleta" autocomplete="off" required>
                </label>
                <datalist id="sets"></datalist>
                <div id="chosen" class="chosen" hidden></div>
                <div>
                    Stanje *
                    <div class="radios">
                        <label><input name="condition" type="radio" value="sealed" required> zapečaten</label>
                        <label><input name="condition" type="radio" value="new"> nov</label>
                        <label><input name="condition" type="radio" value="used"> rabljen</label>
                    </div>
                </div>
                <label>Cena (€) * <input name="price" type="number" step="0.01" min="0.01" required></label>
                <label>Opis (neobvezno) <textarea name="description" rows="4"></textarea></label>
                <div><button class="btn">Oddaj v pregled</button> <small class="muted">* obvezno polje</small></div>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        const input = document.getElementById("set");
        const chosenBox = document.getElementById("chosen");
        let sets = [];
        let chosen = null;

        input.oninput = async () => {
            chosen = sets.find((s) => `${s.set_number} ${s.name}` === input.value) ?? null;
            chosenBox.hidden = !chosen;
            if (chosen) {
                chosenBox.replaceChildren(el("strong", { textContent: input.value }), el("br"),
                    el("small", { textContent: `${chosen.theme} · ${chosen.piece_count} kock · ${chosen.release_year}` }));
                return;
            }
            sets = (await api("GET", `/sets?q=${encodeURIComponent(input.value)}`)).data;
            document.getElementById("sets").replaceChildren(...sets.map((s) => new Option(`${s.set_number} ${s.name}`)));
        };

        document.getElementById("form").onsubmit = async (event) => {
            event.preventDefault();
            if (!chosen) {
                return toast("Izberite komplet iz kataloga.", true);
            }
            const form = Object.fromEntries(new FormData(event.target));
            const { ok, data } = await api("POST", "/listings", { ...form, set_id: chosen.id });
            if (!ok) {
                return toast(errorText(data, "Preverite vnesene podatke."), true);
            }
            event.target.reset();
            chosen = null;
            chosenBox.hidden = true;
            toast("Oglas je oddan v pregled.");
        };
    </script>
</body>
</html>
