<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <title>Prijava – KockiTsa</title>
</head>
<body>
    <header id="header"></header>
    <h1>Prijava</h1>
    <form id="form">
        <p><label>E-pošta <input name="email" type="email" required></label></p>
        <p><label>Geslo <input name="password" type="password" required></label></p>
        <p id="error"></p>
        <button>Prijavi se</button>
    </form>
    <script src="app.js"></script>
    <script>
        document.getElementById("form").onsubmit = async (event) => {
            event.preventDefault();
            const { ok, data } = await api("POST", "/login", Object.fromEntries(new FormData(event.target)));
            if (ok) {
                location.href = "/";
            } else {
                document.getElementById("error").textContent = errorText(data, "Izpolnite vsa polja.");
            }
        };
    </script>
</body>
</html>
