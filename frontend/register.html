<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registracija – KockiTsa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header"></header>
    <main>
        <div class="panel">
            <h2>Registracija</h2>
            <form id="form" class="form">
                <label>Ime <input name="name" required></label>
                <label>E-pošta <input name="email" type="email" required></label>
                <label>Geslo <input name="password" type="password" required></label>
                <div>
                    Vloga
                    <div class="radios">
                        <label><input name="role" type="radio" value="buyer" required> kupec</label>
                        <label><input name="role" type="radio" value="seller"> prodajalec</label>
                    </div>
                </div>
                <div><button class="btn">Registriraj se</button></div>
                <p class="muted">Že imate račun? <a href="login.html">Prijava</a></p>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        document.getElementById("form").onsubmit = async (event) => {
            event.preventDefault();
            const { ok, data } = await api("POST", "/register", Object.fromEntries(new FormData(event.target)));
            if (ok) {
                location.href = "login.html";
            } else {
                toast(errorText(data, "Izpolnite vsa polja in izberite vlogo."), true);
            }
        };
    </script>
</body>
</html>
