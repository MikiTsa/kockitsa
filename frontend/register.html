<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <title>Registracija – KockiTsa</title>
</head>
<body>
    <header id="header"></header>
    <h1>Registracija</h1>
    <form id="form">
        <p><label>Ime <input name="name" required></label></p>
        <p><label>E-pošta <input name="email" type="email" required></label></p>
        <p><label>Geslo <input name="password" type="password" required></label></p>
        <p>
            Vloga:
            <label><input name="role" type="radio" value="buyer" required> kupec</label>
            <label><input name="role" type="radio" value="seller"> prodajalec</label>
        </p>
        <p id="error"></p>
        <button>Registriraj se</button>
    </form>
    <script src="app.js"></script>
    <script>
        document.getElementById("form").onsubmit = async (event) => {
            event.preventDefault();
            const { ok, data } = await api("POST", "/register", Object.fromEntries(new FormData(event.target)));
            if (ok) {
                location.href = "login.html";
            } else {
                document.getElementById("error").textContent = errorText(data, "Izpolnite vsa polja in izberite vlogo.");
            }
        };
    </script>
</body>
</html>
