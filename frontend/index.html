<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KockiTsa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header"></header>
    <main>
        <div class="panel">
            <h2>Objavljeni oglasi</h2>
            <table>
                <thead><tr><th>Komplet</th><th>Tema</th><th>Stanje</th><th>Cena</th><th>Prodajalec</th></tr></thead>
                <tbody id="listings"></tbody>
            </table>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        async function load() {
            const { ok, data } = await api("GET", "/listings");
            if (!ok) {
                return toast(errorText(data, "Oglasov ni mogoče naložiti."), true);
            }
            const tbody = document.getElementById("listings");
            tbody.replaceChildren(...data.map((l) => el("tr", {},
                el("td", { textContent: `${l.set_number} ${l.set_name}` }),
                el("td", { textContent: l.theme }),
                el("td", { textContent: CONDITIONS[l.condition] }),
                el("td", { textContent: eur.format(l.price) }),
                el("td", { textContent: l.seller_name }))));
            if (!data.length) {
                tbody.append(el("tr", {}, el("td", { colSpan: 5, className: "empty", textContent: "Ni objavljenih oglasov." })));
            }
        }

        load();
    </script>
</body>
</html>
