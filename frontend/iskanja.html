<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moja iskanja – KockiTsa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-login data-role="buyer">
    <header id="header"></header>
    <main>
        <div class="panel" id="reserved" hidden></div>
        <div class="panel">
            <h2>Novo iskanje</h2>
            <form id="form" class="form">
                <label>
                    Komplet iz kataloga *
                    <input id="set" list="sets" placeholder="številka ali ime kompleta" autocomplete="off" required>
                </label>
                <datalist id="sets"></datalist>
                <div id="chosen" class="chosen" hidden></div>
                <label>Najvišja cena (€) * <input name="max_price" type="number" step="0.01" min="0.01" required></label>
                <div>
                    Sprejemljiva stanja *
                    <div class="radios">
                        <label><input name="conditions" type="checkbox" value="sealed"> zapečaten</label>
                        <label><input name="conditions" type="checkbox" value="new"> nov</label>
                        <label><input name="conditions" type="checkbox" value="used"> rabljen</label>
                    </div>
                </div>
                <div><button class="btn">Shrani iskanje</button> <small class="muted">* obvezno polje</small></div>
            </form>
        </div>
        <h2 class="title">Aktivna iskanja</h2>
        <div id="active" class="list"></div>
        <h2 class="title">Izpolnjena iskanja</h2>
        <div id="fulfilled" class="list"></div>
    </main>
    <script src="app.js"></script>
    <script>
        const SEARCH_STATUSES = { active: "aktivno", fulfilled: "izpolnjeno" };
        const input = document.getElementById("set");
        const chosenBox = document.getElementById("chosen");
        let sets = [];
        let chosen = null;

        const fact = (label, ...value) => el("div", {}, el("b", { textContent: `${label}: ` }), ...value);

        function confirmation(l) {
            const box = document.getElementById("reserved");
            box.replaceChildren(el("h2", { textContent: "Oglas je rezerviran" }),
                el("div", { className: "facts" },
                    fact("Komplet", `${l.set_number} ${l.set_name}`),
                    fact("Stanje", CONDITIONS[l.condition]),
                    fact("Cena", eur.format(l.price)),
                    fact("Prodajalec", `${l.seller_name}, `,
                        el("a", { href: `mailto:${l.seller_email}`, textContent: l.seller_email }))),
                el("p", { className: "muted", textContent: "Za prevzem se dogovorite s prodajalcem po e-pošti." }));
            box.hidden = false;
        }

        async function reserve(id) {
            const { ok, data } = await api("POST", `/listings/${id}/reserve`);
            if (ok) {
                confirmation(data);
            }
            toast(ok ? "Oglas je rezerviran." : errorText(data, "Rezervacija ni uspela."), !ok);
            load();
        }

        function matches(s) {
            if (!s.matches.length) {
                return el("p", { className: "muted", textContent: "Ni ujemajočih oglasov." });
            }
            return el("div", {}, el("b", { textContent: `Ujemajoči oglasi (${s.matches.length})` }),
                el("table", {}, el("tbody", {}, ...s.matches.map((m) => el("tr", {},
                    el("td", { textContent: CONDITIONS[m.condition] }),
                    el("td", { textContent: eur.format(m.price) }),
                    el("td", { textContent: `prodajalec: ${m.seller_name}` }),
                    el("td", {}, el("button", { className: "btn small", textContent: "Rezerviraj", onclick: () => reserve(m.id) })))))));
        }

        input.oninput = async () => {
            chosen = sets.find((s) => `${s.set_number} ${s.name}` === input.value) ?? null;
            chosenBox.hidden = !chosen;
            if (chosen) {
                chosenBox.replaceChildren(el("strong", { textContent: input.value }), el("br"),
                    el("small", { textContent: `${chosen.theme} · ${chosen.piece_count} kock · ${chosen.release_year}` }));
                return;
            }
            sets = (await api("GET", `/sets?q=${encodeURIComponent(input.value)}`)).data;
            document.getElementById("sets").replaceChildren(...sets.map((s) => new Option(`${s.set_number} ${s.name}`)));
        };

        document.getElementById("form").onsubmit = async (event) => {
            event.preventDefault();
            if (!chosen) {
                return toast("Izberite komplet iz kataloga.", true);
            }
            const form = new FormData(event.target);
            const conditions = form.getAll("conditions");
            if (!conditions.length) {
                return toast("Izberite vsaj eno sprejemljivo stanje.", true);
            }
            const { ok, data } = await api("POST", "/searches", { set_id: chosen.id, max_price: form.get("max_price"), conditions });
            if (!ok) {
                return toast(errorText(data, "Preverite vnesene podatke."), true);
            }
            event.target.reset();
            chosen = null;
            chosenBox.hidden = true;
            toast("Iskanje je shranjeno.");
            load();
        };

        async function remove(id) {
            const { ok, data } = await api("DELETE", `/searches/${id}`);
            toast(ok ? "Iskanje je izbrisano." : errorText(data, "Iskanja ni mogoče izbrisati."), !ok);
            load();
        }

        function card(s) {
            const active = s.status === "active";
            return el("div", { className: "panel" },
                el("div", { className: "head" }, el("strong", { textContent: `${s.set_number} ${s.set_name}` }),
                    active ? el("button", { className: "btn ghost", textContent: "Izbriši iskanje", onclick: () => remove(s.id) }) : ""),
                el("div", { className: "facts" },
                    fact("Najvišja cena", eur.format(s.max_price)),
                    fact("Sprejemljiva stanja", s.conditions.map((c) => CONDITIONS[c]).join(", ")),
                    fact("Status", SEARCH_STATUSES[s.status])),
                active ? matches(s) : "");
        }

        function fill(id, searches, empty) {
            document.getElementById(id).replaceChildren(...(searches.length
                ? searches.map(card)
                : [el("p", { className: "muted", textContent: empty })]));
        }

        async function load() {
            const { ok, data } = await api("GET", "/my/searches");
            if (!ok) {
                return toast(errorText(data, "Iskanj ni mogoče naložiti."), true);
            }
            fill("active", data.filter((s) => s.status === "active"), "Nimate aktivnih iskanj.");
            fill("fulfilled", data.filter((s) => s.status === "fulfilled"), "Nimate izpolnjenih iskanj.");
            updateCounter();
        }

        currentUser.then((me) => me && load());
    </script>
</body>
</html>
