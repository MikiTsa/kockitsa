services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kockitsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kockitsa
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
