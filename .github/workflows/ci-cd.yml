name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Namestitev Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Namestitev orodij za Python
        run: pip install -r requirements-dev.txt

      - name: Lint backenda (Ruff)
        run: ruff check .

      - name: Namestitev Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Namestitev orodij za JavaScript
        run: npm ci

      - name: Lint frontenda (ESLint)
        run: npm run lint